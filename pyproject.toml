[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "research-agent"
version = "0.1.0"
description = "智能科研智能体系统"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "pymupdf4llm>=0.0",
    "networkx>=3.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "pymilvus>=2.4",
    "docker>=7.0",
    # 多渠道接入依赖
    "pycryptodome>=3.20",   # WeChat AES 加解密
    "qrcode>=7.0",          # WeChat QR 码终端显示
    # Redis（可选，分布式锁 / 消息去重）
    "redis>=5",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
local-embed = ["sentence-transformers>=2.0"]
all = ["openai>=1.0", "sentence-transformers>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]
